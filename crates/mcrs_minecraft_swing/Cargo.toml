[package]
name = "mcrs_minecraft_swing"
description = "Pure arm-swing state machine, cooldown math, effect modifiers, and client-loaded tracking"
version.workspace = true
edition.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
