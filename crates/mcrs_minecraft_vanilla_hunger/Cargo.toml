[package]
name = "mcrs_minecraft_vanilla_hunger"
description = "Server hunger plugin wiring exhaustion sources, natural and peaceful regeneration, starvation damage requests, and spectator chunk gating"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
test = false
doctest = false

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
bevy_ecs.workspace = true
mcrs_minecraft_damage = { workspace = true, features = ["bevy"] }
mcrs_minecraft_engine.workspace = true
mcrs_minecraft_engine_damage.workspace = true
mcrs_minecraft_engine_physics.workspace = true
mcrs_minecraft_engine_world.workspace = true
mcrs_minecraft_entity_key = { workspace = true, features = ["bevy"] }
mcrs_minecraft_game_mode = { workspace = true, features = ["bevy"] }
mcrs_minecraft_game_rule.workspace = true
mcrs_minecraft_hunger = { workspace = true, features = ["bevy"] }
mcrs_minecraft_physics.workspace = true
mcrs_minecraft_pose = { workspace = true, features = ["bevy"] }
mcrs_minecraft_save.workspace = true

[dev-dependencies]
bevy_ecs = { workspace = true, features = ["multi_threaded"] }
bevy_math.workspace = true
bevy_tasks = { workspace = true, features = ["multi_threaded"] }
mcrs_minecraft_engine_player_vitals.workspace = true
mcrs_minecraft_entity.workspace = true
mcrs_minecraft_game_registries = { workspace = true, features = ["test-support"] }
mcrs_minecraft_registries = { workspace = true, features = ["bevy"] }
mcrs_voxel.workspace = true
